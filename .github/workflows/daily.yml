name: Daily update
on:
  schedule:
    # GitHub often starts scheduled runs 2 to 6 hours late. Each goes ahead only if it is the day's
    # first, or the first had no fresh wind forecast, or NOAA has since posted newer data (pipeline/rerun.py).
    - cron: "23 7 * * *"    # 07:23 UTC: the night's satellite image, for the morning
    - cron: "53 16 * * *"   # 16:53 UTC: the SIR report NOAA posts in the afternoon
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Decide whether to run
        id: gate
        env:
          EVENT: ${{ github.event_name }}
        run: |
          # a run started by hand always goes ahead
          if [ "$EVENT" = "schedule" ]; then python -m pipeline.rerun >> "$GITHUB_OUTPUT"; else echo "go=true" >> "$GITHUB_OUTPUT"; fi
      - name: Restore the last good wind forecast
        if: steps.gate.outputs.go == 'true'
        uses: actions/cache@v4   # reused when every wind source fails; saved again after the run
        with:
          path: .cache/wind
          key: wind-sxm-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: wind-sxm-
      - name: Tests
        if: steps.gate.outputs.go == 'true'
        run: |
          pip install pytest
          python -m pytest -q
      - name: Fetch data and build the forecast
        if: steps.gate.outputs.go == 'true'
        run: python -m pipeline.run --region sxm --out site/data
      - name: Commit data
        if: steps.gate.outputs.go == 'true'
        run: |
          git config user.name "opensargasso-bot"
          git config user.email "opensargasso-bot@users.noreply.github.com"
          git add site/data/history   # latest.json is deployed below, not committed (see .gitignore)
          git diff --cached --quiet || git commit -m "data: daily update"
          git pull --rebase origin main   # a sighting may have been published meanwhile
          git push
      - if: steps.gate.outputs.go == 'true'
        uses: actions/configure-pages@v5
      - if: steps.gate.outputs.go == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        if: steps.gate.outputs.go == 'true'
        uses: actions/deploy-pages@v4
