name: Daily update
on:
  schedule:
    - cron: "23 11 * * *"   # once a day, 11:23 UTC
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: |
          pip install pytest
          python -m pytest -q
      - name: Fetch data and build the forecast
        run: python -m pipeline.run --region sxm --out site/data
      - name: Commit data
        run: |
          git config user.name "opensargasso-bot"
          git config user.email "opensargasso-bot@users.noreply.github.com"
          git add site/data/history   # latest.json is deployed below, not committed (see .gitignore)
          git diff --cached --quiet || git commit -m "data: daily update"
          git pull --rebase origin main   # a sighting may have been published meanwhile
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
