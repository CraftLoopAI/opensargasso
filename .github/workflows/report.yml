name: Publish approved sighting
# A maintainer adds the "report-approved" label to a sighting issue to publish it.
on:
  issues:
    types: [labeled]
permissions:
  contents: write
  issues: write
jobs:
  publish:
    if: github.event.label.name == 'report-approved' && contains(github.event.issue.labels.*.name, 'sargassum-report')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Add the report
        run: python -m pipeline.reports --event "$GITHUB_EVENT_PATH" --region sxm
      - name: Commit
        run: |
          git config user.name "opensargasso-bot"
          git config user.email "opensargasso-bot@users.noreply.github.com"
          git add site/data/reports.geojson
          git diff --cached --quiet || git commit -m "report: sighting #${{ github.event.issue.number }}"
          git push
      - name: Close the issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }} --comment "Published. It appears on the map after the next daily update."
