name: Publish approved sighting
# A maintainer adds the "report-approved" label to a sighting issue to publish it.
on:
  issues:
    types: [labeled]
permissions:
  contents: write
  issues: write
  actions: write   # to start the daily update, which puts the sighting on the site
jobs:
  publish:
    if: github.event.label.name == 'report-approved' && contains(github.event.issue.labels.*.name, 'sargassum-report')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Add the report
        id: add
        shell: bash   # with pipefail, so a rejected report fails this step
        run: python -m pipeline.reports --event "$GITHUB_EVENT_PATH" --region sxm | tee report.log
      - name: Commit
        run: |
          git config user.name "opensargasso-bot"
          git config user.email "opensargasso-bot@users.noreply.github.com"
          git add site/data/reports.geojson
          git diff --cached --quiet || git commit -m "report: sighting #${{ github.event.issue.number }}"
          git pull --rebase origin main   # the daily update may have pushed meanwhile
          git push
      - name: Update the site
        # A push with this token starts no workflow, but a dispatch does. The update reads the
        # sightings and raises the beach's level; a run started by hand always goes ahead.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run daily.yml --repo ${{ github.repository }} --ref main
      - name: Close the issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }} --comment "Published. It appears on the site in a few minutes, after the update this starts."
      - name: Explain a rejected report
        if: failure() && steps.add.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "This sighting could not be published:"; echo; tail -n 3 report.log 2>/dev/null || echo "see the workflow log"; } > reply.md
          gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body-file reply.md
